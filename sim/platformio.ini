[platformio]
default_envs = native_cardputer_adv

[env:native_cardputer_adv]
platform = native
build_type = debug
lib_dir = lib
lib_extra_dirs =
	/Users/liwenfu/Documents/Arduino/libraries/M5GFX
	/Users/liwenfu/Documents/Arduino/libraries/M5Unified
build_src_filter = +<*>
build_flags =
	-O0
	-g
	-xc++
	-std=c++14
	-lSDL2
	-I/opt/homebrew/include/SDL2
	-L/opt/homebrew/lib
	-DM5GFX_SCALE=3
	-DM5GFX_ROTATION=0
	-DM5GFX_BOARD=board_M5CardputerADV
