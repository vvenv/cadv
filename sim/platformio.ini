; Native SDL simulator — builds firmware/src against host stubs (same app code as device).
[platformio]
default_envs = native_cardputer_adv

[env:native_cardputer_adv]
platform = native
build_type = debug
lib_extra_dirs =
	/Users/liwenfu/Documents/Arduino/libraries/M5GFX
	/Users/liwenfu/Documents/Arduino/libraries/M5Unified
; App code is firmware/src/main.cpp (symlinked as src/main.cpp).
build_src_filter = +<*>
build_flags =
	-O0
	-g
	-xc++
	-std=c++14
	-lSDL2
	-I/opt/homebrew/include/SDL2
	-L/opt/homebrew/lib
	; Logical panel stays 240x135; SCALE only enlarges the SDL window.
	; On Retina, 2 ≈ 480x270 (still tiny). 4 ≈ 960x540 is usable.
	-DM5GFX_SCALE=4
	-DM5GFX_BOARD=board_M5CardputerADV
	-DCADV_SIM=1
; Only project sources see host Arduino/WiFi stubs + firmware config.h
build_src_flags =
	-I../firmware/include
	-Ilib/cadv_host/include
