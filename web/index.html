<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CADV 网页烧录</title>
<meta name="description" content="在浏览器里给 Cardputer-Adv 烧录 CADV 基座和小程序">
<link rel="stylesheet" href="style.css">
<script type="module" src="https://unpkg.com/esp-web-tools@10.4.0/dist/web/install-button.js?module"></script>
</head>
<body>
<main>
	<header>
		<h1>CADV<small>{{VERSION}}</small></h1>
		<a href="help.html">帮助</a>
	</header>

	<div class="card">
		<div class="row">
			<span class="step">1</span>
			<div class="what">
				<span class="name"><a href="app/base.html">基座</a>
					<span class="tip" tabindex="0" data-tip="电源关 → 按住 G0 → 插 USB → 松开，再点烧录。&#10;烧完按 RESET。">?</span>
				</span>
				<span class="sub">烧进芯片，开机后从卡里选程序</span>
			</div>
			<esp-web-install-button manifest="fw/base.json">
				<button slot="activate">烧录</button>
				<span slot="unsupported">请用电脑上的 Chrome 或 Edge</span>
				<span slot="not-allowed">需要 https 页面</span>
			</esp-web-install-button>
		</div>
		<div class="row">
			<span class="step">2</span>
			<div class="what">
				<span class="name">SD 卡程序包
					<span class="tip" tabindex="0" data-tip="zip 里是一个 cadv 文件夹，放到 microSD 卡根目录，插回板子。&#10;升级时整个覆盖。">?</span>
				</span>
				<span class="sub">全部程序，解压到 microSD 卡根目录</span>
			</div>
			<a class="btn" href="{{SD_ZIP}}" download>下载</a>
		</div>
	</div>

	<h2>单独烧一个程序
		<span class="tip" tabindex="0" data-tip="不要基座、只用一个程序时用。&#10;会盖掉芯片里的基座，想回去再烧一次基座。">?</span>
	</h2>
	<ul class="apps">
{{APPS}}
	</ul>

	<footer><a href="https://github.com/vvenv/cadv">源码</a></footer>
</main>
</body>
</html>
