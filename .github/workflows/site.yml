# Republish only the web flasher pages (cadv.wenfu.dev) when the pages or the
# READMEs change. No firmware is compiled: the images and the SD bundle are
# reused from the last firmware build, so this takes about a minute.
#
# Firmware goes out through release.yml when a v* tag is pushed (or by hand).

name: site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "fw/*/README.md"
      - "fw/*/label"
      - "scripts/make_site.py"
      - "scripts/webmd.py"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.release.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      # Newest images first: the last successful release.yml run (a tag or a
      # manual dev build) keeps its pages artifact 90 days. Older than that,
      # fall back to the assets of the latest GitHub release.
      - id: release
        name: Images from the last firmware build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prebuilt
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$run" ] && gh run download "$run" --repo "$GITHUB_REPOSITORY" -n github-pages -D prev 2>/dev/null; then
            mkdir -p prev/site && tar -xf prev/artifact.tar -C prev/site
            cp prev/site/fw/*.bin prev/site/cadv-sd-*.zip prebuilt/
            version=$(python3 -c "import json;print(json.load(open('prev/site/fw/base.json'))['version'])")
            echo "::notice::Reusing images from release.yml run $run ($version)"
          else
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            if [ -z "$tag" ]; then
              echo "::notice::No firmware build to reuse. Push a v* tag; release.yml builds the firmware and the site."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" -D prebuilt --pattern '*.bin' --pattern 'cadv-sd-*.zip'
            version="${tag#v}"
            echo "::notice::Reusing images from release $tag"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pages
        if: steps.release.outputs.skip != 'true'
        run: python3 scripts/make_site.py --version "${{ steps.release.outputs.version }}" --prebuilt prebuilt

      - uses: actions/upload-pages-artifact@v3
        if: steps.release.outputs.skip != 'true'
        with:
          path: dist/site

  pages:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
